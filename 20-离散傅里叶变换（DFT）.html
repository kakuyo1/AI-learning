<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D DFT 可视化 - 离散傅里叶变换应用</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.6);
            padding: 12px 24px;
            border-radius: 30px;
            pointer-events: none;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.2);
            z-index: 100;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        #info h1 {
            margin: 0;
            font-size: 1.2rem;
            font-weight: 400;
            letter-spacing: 1px;
        }
        #info h1 span {
            font-weight: 700;
            color: #ffaa00;
        }
        #note {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: rgba(255,255,255,0.8);
            background: rgba(0,0,0,0.4);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            backdrop-filter: blur(5px);
            z-index: 100;
        }
        .controls-hint {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: rgba(255,255,255,0.6);
            background: rgba(0,0,0,0.3);
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 0.8rem;
            backdrop-filter: blur(5px);
            z-index: 100;
        }
    </style>
</head>
<body>
    <div id="info">
        <h1>离散傅里叶变换 (DFT) <span>3D 可视化</span> — 时域信号分解为频域正弦波</h1>
    </div>
    <div id="note">每一根柱体代表一个频率分量 | 高度 = 幅度 | 颜色 = 相位</div>
    <div class="controls-hint">鼠标拖动旋转 / 滚轮缩放</div>

    <!-- 引入 Three.js 核心库和辅助库 -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        // --- 初始化场景、相机、渲染器 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050510);
        
        // 添加一些星空的点缀 (粒子系统)
        const starsGeometry = new THREE.BufferGeometry();
        const starsCount = 2000;
        const starPositions = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount * 3; i += 3) {
            starPositions[i] = (Math.random() - 0.5) * 2000;
            starPositions[i+1] = (Math.random() - 0.5) * 2000;
            starPositions[i+2] = (Math.random() - 0.5) * 2000;
        }
        starsGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        const starsMaterial = new THREE.PointsMaterial({color: 0xffffff, size: 0.5, transparent: true});
        const stars = new THREE.Points(starsGeometry, starsMaterial);
        scene.add(stars);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(20, 15, 30);
        camera.lookAt(0, 0, 0);

        // WebGL 渲染器
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true; // 为了美观，开启阴影
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // CSS2 渲染器用于文字标签
        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        labelRenderer.domElement.style.left = '0px';
        labelRenderer.domElement.style.pointerEvents = 'none'; // 让标签不阻挡鼠标操作
        document.body.appendChild(labelRenderer.domElement);

        // --- 控制器 ---
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.8;
        controls.enableZoom = true;
        controls.target.set(0, 5, 0);
        controls.maxPolarAngle = Math.PI / 2;

        // --- 灯光 ---
        // 环境光
        const ambientLight = new THREE.AmbientLight(0x404060);
        scene.add(ambientLight);

        // 主光源 - 产生阴影和立体感
        const mainLight = new THREE.DirectionalLight(0xffffff, 1);
        mainLight.position.set(10, 20, 10);
        mainLight.castShadow = true;
        mainLight.receiveShadow = true;
        mainLight.shadow.mapSize.width = 1024;
        mainLight.shadow.mapSize.height = 1024;
        const d = 30;
        mainLight.shadow.camera.left = -d;
        mainLight.shadow.camera.right = d;
        mainLight.shadow.camera.top = d;
        mainLight.shadow.camera.bottom = -d;
        mainLight.shadow.camera.near = 1;
        mainLight.shadow.camera.far = 50;
        scene.add(mainLight);

        // 辅助背景光
        const fillLight = new THREE.PointLight(0x4466ff, 0.5);
        fillLight.position.set(-10, 5, 10);
        scene.add(fillLight);

        // 添加一个背光增强轮廓
        const backLight = new THREE.PointLight(0xffaa44, 0.4);
        backLight.position.set(0, 10, -20);
        scene.add(backLight);

        // 添加一个网格地面来增强空间感 (半透明)
        const gridHelper = new THREE.GridHelper(40, 20, 0x3399ff, 0x224466);
        gridHelper.position.y = -0.01;
        scene.add(gridHelper);

        // 轻微的地面平面用于接收阴影
        const planeGeometry = new THREE.PlaneGeometry(40, 40);
        const planeMaterial = new THREE.ShadowMaterial({ opacity: 0.2, color: 0x000000 });
        const plane = new THREE.Mesh(planeGeometry, planeMaterial);
        plane.rotation.x = -Math.PI / 2;
        plane.position.y = 0;
        plane.receiveShadow = true;
        scene.add(plane);

        // --- 构建 DFT 可视化核心 ---
        // 我们模拟一个时域信号，并计算其 DFT，然后用 3D 柱状图展示频率分量的幅度和相位。
        // 为了视觉清晰，我们使用 N = 32 个采样点，频率分量也取 32 个（对称，但只展示正频率部分或全部循环）。
        // 实际上我们会展示 0 到 N-1 的频率 bin，但为了美观，我们只展示 N/2 个频率分量（正频率），因为负频率是共轭对称的。
        // 不过为了更有“DFT”的感觉，我们展示全部 N 个分量，但只对前半部分赋予较大幅度。
        
        const N = 32; // 采样点数 / 频率分量数
        const sampleRate = 1.0; // 归一化采样率
        
        // 生成一个模拟时域信号：由多个正弦波叠加而成，并添加一些噪声
        const timeSignal = [];
        for (let n = 0; n < N; n++) {
            const t = n / N; // 0 到 1 之间的时间
            // 主频率成分: 频率 3 和 7 (cycles per N samples)
            const val = 0.8 * Math.sin(2 * Math.PI * 3 * t) 
                      + 0.5 * Math.sin(2 * Math.PI * 7 * t + 0.5)
                      + 0.3 * Math.sin(2 * Math.PI * 12 * t + 1.2)
                      + 0.2 * (Math.random() - 0.5); // 少量噪声
            timeSignal.push(val);
        }

        // 计算 DFT (直接按定义，N^2 复杂度，但 N=32 很快)
        const dftReal = new Array(N).fill(0);
        const dftImag = new Array(N).fill(0);
        for (let k = 0; k < N; k++) {
            let realSum = 0;
            let imagSum = 0;
            for (let n = 0; n < N; n++) {
                const angle = -2 * Math.PI * k * n / N;
                realSum += timeSignal[n] * Math.cos(angle);
                imagSum += timeSignal[n] * Math.sin(angle);
            }
            dftReal[k] = realSum;
            dftImag[k] = imagSum;
        }

        // 计算幅度和相位
        const magnitudes = [];
        const phases = [];
        for (let k = 0; k < N; k++) {
            const mag = Math.sqrt(dftReal[k] * dftReal[k] + dftImag[k] * dftImag[k]);
            magnitudes.push(mag);
            phases.push(Math.atan2(dftImag[k], dftReal[k]));
        }

        // 为了视觉上更清晰，将频率分量重新排序：把低频放在中间，高频向两边分散？
        // 或者按顺序排列 0..N-1，但让柱体围绕一个半圆或直线排列。
        // 这里选择围绕一个半圆排列，形成一种频谱环的感觉，更具 3D 感。
        // 但为了易于理解，使用线性排列在 X 轴上，Y 轴为幅度。
        // 不过为了更有视觉冲击力，采用环形排列，角度对应频率索引，半径固定，Y轴为幅度。
        // 修改：采用半圆排列，从 -PI/2 到 PI/2 映射频率索引。
        // 但半圆可能不容易看清所有柱子，我们还是使用直线排列，但稍微倾斜。
        
        // 决定使用直线排列：X 从 -15 到 15，Y 为幅度，Z 为相位对应的颜色。
        // 但为了更具 3D 感，让柱体围绕一个圆柱排列？那样很难比较高度。
        // 最终决定：使用直线排列在 X 轴上，但让柱体稍微环绕，即 X 位置对应频率，但 Z 位置按正弦变化？不，那样会混乱。
        // 还是采用最清晰的：线性排列，柱子宽度 0.6，间距 1。
        
        const barWidth = 0.6;
        const spacing = 1.0;
        const totalWidth = (N - 1) * spacing;
        const startX = -totalWidth / 2;
        
        const bars = []; // 存储柱体 mesh 和对应的频率索引

        // 为了好看，柱体使用渐变颜色，并添加发光边缘
        // 颜色映射：相位从 -PI 到 PI 映射到色相 0 到 1
        const color = new THREE.Color();

        // 计算最大幅度用于归一化高度
        const maxMag = Math.max(...magnitudes);
        
        // 创建柱体
        for (let k = 0; k < N; k++) {
            // 幅度作为高度，最小高度 0.1 避免看不见
            const height = Math.max(0.1, magnitudes[k] * 2.5); // 缩放因子 2.5 使柱子更明显
            const xPos = startX + k * spacing;
            
            // 几何体：长方体
            const geometry = new THREE.BoxGeometry(barWidth, height, barWidth);
            
            // 根据相位决定颜色
            const phase = phases[k];
            // 将相位 -PI 到 PI 映射到色相 0 到 1
            let hue = (phase + Math.PI) / (2 * Math.PI);
            // 调整色相使颜色更鲜明：低频偏向蓝紫色，高频偏向橙红色？简单使用相位映射
            // 同时根据幅度调整亮度
            const lightness = 0.4 + (magnitudes[k] / maxMag) * 0.5;
            color.setHSL(hue, 0.9, lightness);
            
            const material = new THREE.MeshStandardMaterial({
                color: color,
                emissive: new THREE.Color(0x222222),
                roughness: 0.3,
                metalness: 0.2,
                emissiveIntensity: 0.3
            });
            
            const bar = new THREE.Mesh(geometry, material);
            bar.castShadow = true;
            bar.receiveShadow = true;
            
            // 位置：Y 坐标基于高度的一半，使底部在地面
            bar.position.set(xPos, height / 2, 0);
            
            scene.add(bar);
            
            // 添加一个发光边缘的线框效果？或者加一个小球在顶部？或者加一个光晕
            // 为了更美观，在柱子顶部添加一个小球体，颜色相同
            const topSphereGeo = new THREE.SphereGeometry(0.1, 8, 8);
            const topSphereMat = new THREE.MeshStandardMaterial({ color: color, emissive: color, emissiveIntensity: 0.8 });
            const topSphere = new THREE.Mesh(topSphereGeo, topSphereMat);
            topSphere.position.set(xPos, height, 0);
            topSphere.castShadow = true;
            topSphere.receiveShadow = false;
            scene.add(topSphere);
            
            // 存储柱体信息以便动画
            bars.push({
                mesh: bar,
                topSphere: topSphere,
                baseHeight: height,
                magnitude: magnitudes[k],
                phase: phase,
                index: k,
                xPos: xPos
            });
            
            // 添加频率标签 (每隔一个添加，避免拥挤)
            if (k % 2 === 0 || k === N-1) {
                const labelDiv = document.createElement('div');
                labelDiv.textContent = `f${k}`;
                labelDiv.style.color = '#aaccff';
                labelDiv.style.fontSize = '12px';
                labelDiv.style.fontWeight = 'bold';
                labelDiv.style.textShadow = '0 0 5px rgba(0,0,0,0.8)';
                labelDiv.style.background = 'rgba(20,30,50,0.7)';
                labelDiv.style.padding = '2px 6px';
                labelDiv.style.borderRadius = '10px';
                labelDiv.style.border = '1px solid rgba(100,150,255,0.5)';
                const label = new CSS2DObject(labelDiv);
                label.position.set(xPos, -0.8, 0);
                scene.add(label);
            }
        }

        // 添加一个代表时域信号的曲线？为了更直观，可以在地面上方绘制时域波形？
        // 但 3D 场景中可能会显得杂乱。我们可以在柱子后方添加一条浮动曲线表示时域信号。
        // 但为了突出 DFT，这一步可选。这里我们添加一个半透明的时域波形曲线在 Z 负方向。
        const timePoints = [];
        for (let n = 0; n < N; n++) {
            const x = startX + n * spacing;
            const y = 1.5 + timeSignal[n] * 1.5; // 缩放并抬高
            timePoints.push(new THREE.Vector3(x, y, -2));
        }
        const timeLineGeometry = new THREE.BufferGeometry().setFromPoints(timePoints);
        const timeLineMaterial = new THREE.LineBasicMaterial({ color: 0x44aaff, linewidth: 1 }); // linewidth not supported everywhere
        const timeLine = new THREE.Line(timeLineGeometry, timeLineMaterial);
        scene.add(timeLine);
        
        // 添加小圆点标记
        const timeDotsMaterial = new THREE.PointsMaterial({ color: 0x44aaff, size: 0.15 });
        const timeDotsGeometry = new THREE.BufferGeometry().setFromPoints(timePoints);
        const timeDots = new THREE.Points(timeDotsGeometry, timeDotsMaterial);
        scene.add(timeDots);
        
        // 添加一个标签说明时域信号
        const timeLabelDiv = document.createElement('div');
        timeLabelDiv.textContent = '时域信号 (输入)';
        timeLabelDiv.style.color = '#88ccff';
        timeLabelDiv.style.fontSize = '14px';
        timeLabelDiv.style.fontWeight = 'bold';
        timeLabelDiv.style.background = 'rgba(0,0,0,0.5)';
        timeLabelDiv.style.padding = '4px 12px';
        timeLabelDiv.style.borderRadius = '16px';
        timeLabelDiv.style.border = '1px solid #44aaff';
        const timeLabel = new CSS2DObject(timeLabelDiv);
        timeLabel.position.set(startX - 3, 4, -2);
        scene.add(timeLabel);
        
        // 在柱体区域添加一个半透明的包围框或者背景平面增强深度感？不需要了。

        // 添加一些漂浮粒子增加科技感
        const particleCount = 400;
        const particleGeo = new THREE.BufferGeometry();
        const particlePositions = new Float32Array(particleCount * 3);
        for (let i = 0; i < particleCount * 3; i += 3) {
            particlePositions[i] = (Math.random() - 0.5) * 50;
            particlePositions[i+1] = (Math.random() - 0.5) * 20 + 10;
            particlePositions[i+2] = (Math.random() - 0.5) * 30;
        }
        particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
        const particleMat = new THREE.PointsMaterial({ color: 0x88aaff, size: 0.08, transparent: true, opacity: 0.5 });
        const particles = new THREE.Points(particleGeo, particleMat);
        scene.add(particles);

        // --- 动画循环 ---
        let clock = new THREE.Clock();

        function animate() {
            const delta = clock.getDelta();
            const elapsedTime = performance.now() / 1000; // seconds

            // 自动旋转控制
            controls.update();

            // 让星星缓慢旋转
            stars.rotation.y += 0.0001;
            stars.rotation.x += 0.00005;
            
            // 粒子浮动
            particles.rotation.y += 0.0002;

            // 让柱体顶部的球体有轻微的脉冲效果
            bars.forEach((bar, idx) => {
                // 根据幅度和相位，让柱子有轻微的呼吸效果
                const pulse = Math.sin(elapsedTime * 2 + idx) * 0.05 + 1;
                // 但不要改变 mesh 的 scale，因为那会影响位置。简单调整顶部球体的发光强度？
                // 或者改变顶部球体大小
                if (bar.topSphere) {
                    bar.topSphere.scale.setScalar(1 + Math.sin(elapsedTime * 3 + idx) * 0.1);
                }
                // 轻微旋转柱子？没必要
            });

            // 渲染
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);

            requestAnimationFrame(animate);
        }

        animate();

        // --- 窗口大小调整响应 ---
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
        }

        // 添加一些简单的说明文字（使用 CSS2D 在 3D 空间中的标签）
        // 但已经添加了频率标签。
        
        // 添加一个大的轴标签 Y 轴
        const yAxisLabelDiv = document.createElement('div');
        yAxisLabelDiv.textContent = '幅度';
        yAxisLabelDiv.style.color = '#ffaa00';
        yAxisLabelDiv.style.fontSize = '14px';
        yAxisLabelDiv.style.fontWeight = 'bold';
        yAxisLabelDiv.style.background = 'rgba(0,0,0,0.4)';
        yAxisLabelDiv.style.padding = '2px 8px';
        yAxisLabelDiv.style.borderRadius = '12px';
        const yAxisLabel = new CSS2DObject(yAxisLabelDiv);
        yAxisLabel.position.set(startX - 2, 10, 0);
        scene.add(yAxisLabel);
        
        // 颜色条说明相位？略。
    </script>
</body>
</html>
