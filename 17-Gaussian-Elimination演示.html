<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gaussian Elimination 动画演示</title>
  <style>
    :root {
      --bg: #0f1117;
      --panel: #1a1d27;
      --border: #2a2e3a;
      --text: #e8eaed;
      --muted: #9aa0a6;
      --blue: #8ab4f8;
      --green: #81c995;
      --orange: #fdd663;
      --red: #f28b82;
      --purple: #c58af9;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.65;
      padding: 1.5rem 1rem 3rem;
    }
    .container { max-width: 920px; margin: 0 auto; }
    h1 { font-size: 1.5rem; color: #fff; margin-bottom: 0.25rem; }
    .subtitle { color: var(--muted); margin-bottom: 1rem; font-size: 0.92rem; }
    .intro {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.9rem 1.15rem;
      margin-bottom: 1rem;
      font-size: 0.9rem;
      color: #c4c7ce;
    }
    .intro strong { color: #fff; }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.1rem 1.3rem;
      margin-bottom: 1rem;
    }
    .controls {
      display: flex; flex-wrap: wrap; gap: 0.5rem;
      align-items: center; margin-bottom: 0.9rem;
    }
    button {
      background: #2a2e3a; color: var(--text);
      border: 1px solid var(--border); border-radius: 8px;
      padding: 0.4rem 0.85rem; font-size: 0.85rem; cursor: pointer;
    }
    button:hover { background: #353a48; }
    button.primary { background: #1a73e8; border-color: #1a73e8; color: #fff; }
    .step-bar {
      display: flex; flex-wrap: wrap; gap: 0.35rem;
      margin-bottom: 0.8rem;
    }
    .step {
      padding: 0.28rem 0.65rem;
      border-radius: 16px;
      font-size: 0.78rem;
      background: #12141c;
      color: var(--muted);
      border: 1px solid var(--border);
    }
    .step.on {
      background: rgba(26,115,232,0.25);
      color: var(--blue);
      border-color: #1a73e8;
    }
    .step.done {
      background: rgba(129,201,149,0.12);
      color: var(--green);
      border-color: #188038;
    }
    .mat-wrap {
      overflow-x: auto;
      margin: 0.6rem 0;
    }
    table.mat {
      border-collapse: collapse;
      font-family: "SF Mono", Consolas, monospace;
      font-size: 1rem;
      margin: 0 auto;
    }
    table.mat td {
      width: 64px;
      height: 48px;
      text-align: center;
      border: 1px solid #2a2e3a;
      background: #12141c;
      transition: background 0.25s, color 0.25s;
    }
    table.mat td.pivot {
      background: rgba(253, 214, 99, 0.25);
      color: #fdd663;
      font-weight: bold;
    }
    table.mat td.elim {
      background: rgba(242, 139, 130, 0.2);
      color: #f28b82;
    }
    table.mat td.zero {
      color: #81c995;
    }
    table.mat td.aug {
      border-left: 2px solid #8ab4f8;
    }
    table.mat td.active-row {
      outline: 2px solid #8ab4f8;
    }
    .log {
      font-size: 0.9rem;
      color: #c4c7ce;
      min-height: 3.2em;
      margin-top: 0.6rem;
      line-height: 1.6;
    }
    .sol {
      font-family: "SF Mono", Consolas, monospace;
      font-size: 1.05rem;
      color: #81c995;
      margin-top: 0.5rem;
    }
    .explain {
      font-size: 0.88rem;
      color: #c4c7ce;
      margin-top: 0.8rem;
    }
    .explain strong { color: #fff; }
    footer {
      margin-top: 1.4rem; text-align: center;
      color: var(--muted); font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Gaussian Elimination 动画</h1>
    <p class="subtitle">增广矩阵 · 消元成上三角 · 回代求 x</p>

    <div class="intro">
      <strong>例子：</strong>
      2x+y+z=8，　4x+3y+3z=20，　2x+3y+z=12。<br>
      逐步把对角线下方消成 0，再从下往回解。黄格 = 当前主元，红格 = 正在消的位置。
    </div>

    <div class="panel">
      <div class="controls">
        <button class="primary" id="btnNext">下一步</button>
        <button id="btnAuto">自动播放</button>
        <button id="btnReset">重置</button>
      </div>

      <div class="step-bar" id="steps"></div>

      <div class="mat-wrap">
        <table class="mat" id="mat"></table>
      </div>

      <div class="log" id="log">点「下一步」开始消元</div>
      <div class="sol" id="sol"></div>

      <div class="explain">
        <strong>流程：</strong>选主元 → 用倍数把同列下方消成 0 → 整列做完进入下一列 → 得到上三角后回代。
      </div>
    </div>

    <footer>Gaussian elimination · 17-linear-systems</footer>
  </div>

  <script>
    // Augmented matrix [A|b]
    const initial = [
      [2, 1, 1, 8],
      [4, 3, 3, 20],
      [2, 3, 1, 12]
    ];

    let M = initial.map(r => r.slice());
    let phase = 0;
    // phases described in script
    let autoTimer = null;

    const phaseList = [
      '初始增广矩阵',
      '列0：用 R0 消 R1',
      '列0：用 R0 消 R2',
      '列1：用 R1 消 R2',
      '上三角完成',
      '回代：求 z',
      '回代：求 y',
      '回代：求 x',
      '完成'
    ];

    let highlight = { pivot: null, elim: [], rows: [] };
    let solution = [null, null, null];

    function renderSteps() {
      const el = document.getElementById('steps');
      el.innerHTML = phaseList.map((name, i) => {
        let cls = 'step';
        if (i < phase) cls += ' done';
        if (i === phase) cls += ' on';
        return '<span class="' + cls + '">' + (i + 1) + '. ' + name + '</span>';
      }).join('');
    }

    function renderMat() {
      const table = document.getElementById('mat');
      let html = '';
      for (let i = 0; i < 3; i++) {
        html += '<tr>';
        for (let j = 0; j < 4; j++) {
          let cls = j === 3 ? 'aug' : '';
          const val = M[i][j];
          const isPivot = highlight.pivot && highlight.pivot[0] === i && highlight.pivot[1] === j;
          const isElim = highlight.elim.some(p => p[0] === i && p[1] === j);
          if (isPivot) cls += ' pivot';
          if (isElim) cls += ' elim';
          if (Math.abs(val) < 1e-9 && j < 3 && i > j) cls += ' zero';
          if (highlight.rows.includes(i)) cls += ' active-row';
          const show = Math.abs(val) < 1e-9 ? '0' : (Number.isInteger(val) ? String(val) : val.toFixed(2));
          html += '<td class="' + cls + '">' + show + '</td>';
        }
        html += '</tr>';
      }
      table.innerHTML = html;
    }

    function setLog(msg) {
      document.getElementById('log').innerHTML = msg;
    }

    function showSol() {
      const s = solution;
      if (s[0] !== null) {
        document.getElementById('sol').textContent =
          '解：x = ' + s[0] + '， y = ' + s[1] + '， z = ' + s[2];
      } else {
        document.getElementById('sol').textContent = '';
      }
    }

    function next() {
      if (phase >= phaseList.length - 1) return;

      if (phase === 0) {
        phase = 1;
        highlight = { pivot: [0, 0], elim: [[1, 0]], rows: [0, 1] };
        setLog('主元 A[0][0]=2。倍数 m = 4/2 = 2。<br>R1 ← R1 − 2·R0，把下面的 4 消成 0。');
        // apply
        const m = M[1][0] / M[0][0];
        for (let j = 0; j < 4; j++) M[1][j] -= m * M[0][j];
      } else if (phase === 1) {
        phase = 2;
        highlight = { pivot: [0, 0], elim: [[2, 0]], rows: [0, 2] };
        setLog('倍数 m = 2/2 = 1。<br>R2 ← R2 − 1·R0，把 A[2][0] 消成 0。');
        const m = M[2][0] / M[0][0];
        for (let j = 0; j < 4; j++) M[2][j] -= m * M[0][j];
      } else if (phase === 2) {
        phase = 3;
        highlight = { pivot: [1, 1], elim: [[2, 1]], rows: [1, 2] };
        setLog('进入第 2 列。主元 A[1][1]=1。<br>倍数 m = 2/1 = 2。R2 ← R2 − 2·R1。');
        const m = M[2][1] / M[1][1];
        for (let j = 0; j < 4; j++) M[2][j] -= m * M[1][j];
      } else if (phase === 3) {
        phase = 4;
        highlight = { pivot: null, elim: [], rows: [] };
        setLog('已得到<strong>上三角</strong>矩阵。对角线下方全是 0，可以开始回代。');
      } else if (phase === 4) {
        phase = 5;
        // z from last row: M[2][2]*z = M[2][3]
        const z = M[2][3] / M[2][2];
        solution[2] = Math.round(z * 1000) / 1000;
        highlight = { pivot: [2, 2], elim: [[2, 3]], rows: [2] };
        setLog('回代第 3 行：' + M[2][2].toFixed(0) + '·z = ' + M[2][3].toFixed(0) +
          ' → <strong>z = ' + solution[2] + '</strong>');
      } else if (phase === 5) {
        phase = 6;
        const z = solution[2];
        const y = (M[1][3] - M[1][2] * z) / M[1][1];
        solution[1] = Math.round(y * 1000) / 1000;
        highlight = { pivot: [1, 1], elim: [], rows: [1] };
        setLog('回代第 2 行：y + ' + M[1][2] + '·z = ' + M[1][3] +
          ' → <strong>y = ' + solution[1] + '</strong>');
      } else if (phase === 6) {
        phase = 7;
        const y = solution[1], z = solution[2];
        const x = (M[0][3] - M[0][1] * y - M[0][2] * z) / M[0][0];
        solution[0] = Math.round(x * 1000) / 1000;
        highlight = { pivot: [0, 0], elim: [], rows: [0] };
        setLog('回代第 1 行：2x + y + z = 8 → <strong>x = ' + solution[0] + '</strong>');
      } else if (phase === 7) {
        phase = 8;
        highlight = { pivot: null, elim: [], rows: [] };
        setLog('完成。检验：2(2)+2+2=8，4(2)+3(2)+3(2)=20，2(2)+3(2)+2=12。✓');
      }

      renderSteps();
      renderMat();
      showSol();
    }

    function reset() {
      clearInterval(autoTimer);
      autoTimer = null;
      M = initial.map(r => r.slice());
      phase = 0;
      highlight = { pivot: null, elim: [], rows: [] };
      solution = [null, null, null];
      setLog('点「下一步」开始消元');
      renderSteps();
      renderMat();
      showSol();
    }

    document.getElementById('btnNext').onclick = next;
    document.getElementById('btnAuto').onclick = () => {
      if (autoTimer) return;
      autoTimer = setInterval(() => {
        if (phase >= phaseList.length - 1) {
          clearInterval(autoTimer);
          autoTimer = null;
          return;
        }
        next();
      }, 1400);
    };
    document.getElementById('btnReset').onclick = reset;

    reset();
  </script>
</body>
</html>
